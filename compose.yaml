name: qwen3-27b-5090

# The engine served on port 46320 (its own small image, Dockerfile), and the development services (dev/Dockerfile).
#   docker compose up -d --build serve                    # the serving image, built from this checkout; the OpenAI / Anthropic API on 127.0.0.1:46320
#   docker compose --profile dev run --rm dev-cpu <cmd>   # no GPU attached (safe while another env is serving)
#   docker compose --profile dev run --rm dev <cmd>       # GPU attached (microbenchmarks, GPU reference, engine tests)
x-dev: &dev
  build: ./dev
  image: local/qwen3-27b-5090-dev:cuda13.3-torch2.14.1
  working_dir: /work
  # Host user, so files written into the bind mounts stay editable outside the container.
  user: "${UID:-1000}:${GID:-1000}"
  ipc: host
  ulimits:
    memlock: -1
    stack: 67108864
  environment: &dev-env
    # Weights are fetched ahead of time (scripts/download-weights.sh); never reach the Hub from the container.
    HF_HUB_OFFLINE: "1"
    HF_HOME: /hf
    HOME: /tmp
    PYTHONPATH: /work/reference
  volumes:
    - .:/work
    # Hugging Face cache (scripts/download-weights.sh). Make ./hf a symlink to keep the weights elsewhere.
    - ./hf:/hf
    - ./cache/build:/build

services:
  dev:
    <<: *dev
    gpus: all
    profiles: [dev]
  dev-cpu:
    <<: *dev
    environment:
      <<: *dev-env
      CUDA_VISIBLE_DEVICES: ""
    profiles: [dev]
  serve:
    # libq27.so, the server and its three Python packages; the code is in the image (`--build` after a change).
    # This fork builds its own image. Never pull the upstream one (ghcr.io/mkyt): it has no tiered cache.
    build: .
    image: local/qwen3-27b-5090-serve:tiered-kv-cache
    pull_policy: build
    user: "${UID:-1000}:${GID:-1000}"
    ipc: host
    ulimits:
      memlock: -1
    volumes:
      - ./hf:/hf
      - kvcache:/cache/kv                          # SPILL_DIR: a named volume (the WSL2 disk), not /mnt/c: drvfs is slow
    gpus: all
    container_name: qwen3-27b-5090
    ports:
      # The address on the host; the server in the container always listens on 46320 (HOST=0.0.0.0: the network, and
      # /admin has no authentication).
      - "${HOST:-127.0.0.1}:${PORT:-46320}:46320"
    environment:
      SERVED_MODEL_NAME: ${SERVED_MODEL_NAME:-qwen3.8-27b}  # same name as the vLLM / SGLang environments
      ENGINE_AUTOSTART: ${ENGINE_AUTOSTART:-1}     # 0: the server starts with the engine stopped (no VRAM; start it at /ui)
      MIN_KV_TOKENS: ${MIN_KV_TOKENS:-0}           # do not start if the KV pool would hold fewer tokens (0: any size)
      VRAM_RESERVE_GIB: ${VRAM_RESERVE_GIB:-1.5}   # minimum VRAM left free (display, other programs; below it WDDM pages to RAM)
      Q27_LOAD_THREADS: ${Q27_LOAD_THREADS:-8}     # threads reading the weight files ahead of the uploads
      STATS_SAMPLE_S: ${STATS_SAMPLE_S:-1}         # seconds between the GPU samples of /ui (0: none)
      API_DUMP_DIR: ${API_DUMP_DIR:-}              # debugging: write every POST body to this directory in the container
      ENGINE_IDLE_UNLOAD_S: ${ENGINE_IDLE_UNLOAD_S:-0}  # seconds without a request before the engine frees its VRAM (0: off)
      MAX_TOKENS: ${MAX_TOKENS:-262144}
      MAX_TOKENS_FIT: ${MAX_TOKENS_FIT:-1}         # 1: lower MAX_TOKENS to what the VRAM fits (since P7-13 MAX_SEQS=8 fits 262144)
      MAX_SEQS: ${MAX_SEQS:-4}                     # requests the engine can run at once (fewer while the KV pool is short; more wait)
      MIN_SEQ_TPS: ${MIN_SEQ_TPS:-0}               # start another request only if each keeps this many tok/s (0: off)
      ADMIT_KV: ${ADMIT_KV:-1}                     # 1: a request waits for room in the KV pool (rather than suspend one later)
      KV_RESERVE_TOKENS: ${KV_RESERVE_TOKENS:-4096} # output tokens per request the KV admission keeps room for
      DECODE_SHARE: ${DECODE_SHARE:-0.5}           # decode time of running requests per second of prefill
      SCHED_QUANTUM_MS: ${SCHED_QUANTUM_MS:-50}    # decode turn of a request while several decode
      BATCH_DECODE: ${BATCH_DECODE:-1}             # 1: decoding requests step together (P6-10); 0: they take turns
      PREFILL_CHUNK: ${PREFILL_CHUNK:-2048}
      KV_DTYPE: ${KV_DTYPE:-nvfp4}                # nvfp4 (default since 2026-10-11, P7-9) | fp8 | bf16 (P4-11)
      WEIGHTS: ${WEIGHTS:-gdnfp4}                  # gdnfp4 (GDN projections NVFP4, juzbox/Qwen3.8-27B-NVFP4-GDN) | nvidia (FP8 projections) | quasar | a model dir
      SPEC: ${SPEC:-dflash2}                       # dflash2 | none
      Q27_DRAFT_QUANT: ${Q27_DRAFT_QUANT:-fp4}     # draft linear layers: fp4 | fp8 | bf16
      Q27_DRAFT_VOCAB: ${Q27_DRAFT_VOCAB:-/work/bench/draft-vocab/vocab-128k.txt}  # candidate vocabulary; none: full
      STATE_HOST_CACHE: ${STATE_HOST_CACHE:-8}     # prefix cache: GiB of pinned state checkpoints (0: off)
      KV_POOL_TOKENS: ${KV_POOL_TOKENS:-524288}    # 524288 = 512K tokens (about 9 GiB VRAM with NVFP4 KV); 0: what the VRAM budget leaves
      CHECKPOINT_INTERVAL: ${CHECKPOINT_INTERVAL:-4096}
      SPILL_RAM_GIB: ${SPILL_RAM_GIB:-64}          # host RAM for checkpoints evicted from the KV pool (0: off; the tiers are in docs/tiered-cache.md)
      SPILL_PINNED_GIB: ${SPILL_PINNED_GIB:-0}     # pinned host memory for spill entries, faster copies (off by default: turn on only after scripts/tiered_cache_test.py passes on your GPU; counts against Windows shared GPU memory, see docs/tiered-cache.md)
      SPILL_PINNED_SLAB_MIB: ${SPILL_PINNED_SLAB_MIB:-1024}  # size of each pinned slab, pinned one per idle step (an entry may span several; only used with SPILL_PINNED_GIB)
      SPILL_ASYNC_IO: ${SPILL_ASYNC_IO:-0}         # KV copies on their own stream, no stall of GPU work; frees the CPU only for pinned entries, so use with SPILL_PINNED_GIB (off by default: turn on only after scripts/tiered_cache_test.py passes on your GPU)
      SPILL_ASYNC_PROMOTE: ${SPILL_ASYNC_PROMOTE:-0}  # a request that matches a spilled checkpoint waits for it to load in the background while others run (delay hit), instead of stalling the engine (off by default: turn on only after scripts/tiered_cache_test.py passes (scenario g), together with SPILL_PINNED_GIB and SPILL_ASYNC_IO)
      SPILL_DIR: ${SPILL_DIR:-/cache/kv}           # where spilled checkpoints are written (the kvcache volume above)
      SPILL_RAM_RETENTION_S: ${SPILL_RAM_RETENTION_S:-3600}  # seconds a checkpoint stays in RAM before it is written to SSD (idle time)
      SPILL_SSD_GIB: ${SPILL_SSD_GIB:-100}         # SSD tier cap; the oldest files are deleted first
      SPILL_SSD_MIN_FREE_GIB: ${SPILL_SSD_MIN_FREE_GIB:-10}  # never fill the disk below this much free space
      SPILL_SSD_MIN_TOKENS: ${SPILL_SSD_MIN_TOKENS:-8192}  # spilled checkpoints shorter than this many tokens are never written to SSD (dropped instead; 0: no minimum)
      SPILL_TTL_DAYS: ${SPILL_TTL_DAYS:-7}         # files not reused for this many days are deleted
      SPILL_TICK_S: ${SPILL_TICK_S:-30}            # seconds between the tier maintenance passes
      VRAM_BACKUP_IDLE_S: ${VRAM_BACKUP_IDLE_S:-60}  # idle seconds before VRAM checkpoints are copied to RAM, kept in VRAM (0: off)
      VRAM_BACKUP_VICTIMS: ${VRAM_BACKUP_VICTIMS:-8}  # the idle backup copies only the next N checkpoints the pool would evict (0: any)
      SPILL_FLUSH_ON_STOP_S: ${SPILL_FLUSH_ON_STOP_S:-8}  # seconds a stop may spend backing up and writing RAM entries to SSD (0: off; at most 8)
      VISION: ${VISION:-host}                      # off | host | fp8 | bf16: image input (P4-12)
      IMAGE_MAX_PIXELS: ${IMAGE_MAX_PIXELS:-4194304}  # images are resized to at most this many pixels
      IMAGE_TOKENS: ${IMAGE_TOKENS:-16384}         # image tokens per request (pinned host embeddings, 10 KiB each)
      Q27_ATTN_FP8: ${Q27_ATTN_FP8:-}              # prefill attention MMAs: empty = 2 (FP8 KV) / 3 (NVFP4 KV: Q·K on FP4 MMAs, P7-8); 2 Q·K and P·V in FP8, 1 P·V only, 0 BF16
      Q27_ATTN_FP4_STAGE: ${Q27_ATTN_FP4_STAGE:-1} # NVFP4 KV prefill: V (mode 3) rounded to E4M3 once per call (P7-8; 1 KiB/token; 0 = per CTA, mode 2)
      Q27_ATTN_TC_F8: ${Q27_ATTN_TC_F8:-}          # decode / verify attention MMAs: empty = FP8 with NVFP4 KV (P7-7), 1 = also with FP8 KV, 0 = BF16 / f16
      Q27_MLP_FUSED: ${Q27_MLP_FUSED:-1}           # prefill MLP: 1 = gate | up, silu * up and its NVFP4 quantization in one GEMM (gemm_mma.cu); 0 = BF16 gate | up, then the silu step
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:46320/health', timeout=4)"]
      interval: 10s
      timeout: 5s
      start_period: 600s
    # The server restarts a crashed engine itself; this covers the server. No start with the Docker daemon:
    # only one environment in this repository fits on the GPU at a time.
    restart: on-failure:3

# Named volumes. kvcache: the spilled KV checkpoints of serve (SPILL_DIR).
volumes:
  kvcache:
