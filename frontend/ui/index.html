    <div class="row" style="justify-content:space-between;margin-bottom:8px">
      <h2 style="margin:0">機器</h2>
      <span class="muted" id="clients-sum"></span>
    </div>
    <div class="scroll"><table id="clients"></table></div>
  </section>

  <section class="card" id="deploy-sec" hidden>
    <div class="row" style="justify-content:space-between;margin-bottom:8px">
      <h2 style="margin:0">部署與硬體</h2>
    </div>
    <div id="deploy-body"></div>
  </section>

  <section class="card">
    <div class="row" style="justify-content:space-between;margin-bottom:8px">
      <h2 style="margin:0">進行中的請求</h2>
      <span class="legend" style="margin:0">
        <span><i style="background:var(--s1)"></i>快取（前綴快取）</span>
        <span><i style="background:var(--s3)"></i>已預填</span>
        <span><i style="background:var(--pending)"></i>待計算的輸入</span>
        <span><i style="background:var(--s2)"></i>已生成</span>
        <span><i style="background:var(--ink);opacity:.55;width:2px"></i>訊息邊界</span>
      </span>
    </div>
    <div class="sess" id="sess"></div>
  </section>

  <section class="card">
    <div class="row" style="justify-content:space-between;margin-bottom:8px">
      <h2 style="margin:0">紀錄</h2>
      <div class="row">
        <label class="chk"><input type="checkbox" id="f-req" checked>請求</label>
        <label class="chk"><input type="checkbox" id="f-sub">已送出</label>
        <label class="chk"><input type="checkbox" id="f-ev" checked>事件</label>
        <span class="muted" id="log-sum"></span>
      </div>
    </div>
    <div class="scroll log-wrap"><table class="log" id="log"></table></div>
  </section>
</main>
<div class="tip" id="tip"></div>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const GiB = 1024 ** 3, MiB = 1024 ** 2;
const state = { info: {}, history: [], log: [], tick: null, init: null, ui: null, range: 300, sampleS: 1, hover: null, open: new Set() };

// ---------------------------------------------------------------- formatting
const fmtGiB = (b) => b == null ? "–" : (b / GiB).toFixed(b >= 10 * GiB ? 1 : 2) + " GiB";
const fmtMem = (b) => b == null ? "–" : b >= GiB ? fmtGiB(b) : (b / MiB).toFixed(b >= 100 * MiB ? 0 : 1) + " MiB";
function fmtTok(n) {
  if (n == null) return "–";
  if (n >= 1e6) return (n / 1e6).toFixed(2) + "M";
  if (n >= 1e4) return (n / 1e3).toFixed(1) + "K";
  if (n >= 1e3) return (n / 1e3).toFixed(2) + "K";
  return String(Math.round(n));
}
const fmtRate = (v) => v == null ? "–" : v >= 1000 ? (v / 1000).toFixed(2) + "K" : v.toFixed(v >= 100 ? 0 : 1);
const fmtS = (s) => s == null ? "–" : s >= 60 ? `${Math.floor(s / 60)}m ${Math.round(s % 60)}s` : s >= 10 ? s.toFixed(1) + " s" : s.toFixed(2) + " s";
const fmtPct = (v) => v == null ? "–" : (v * 100).toFixed(v >= 0.995 || v < 0.1 ? 0 : 1) + "%";
const clock = (t) => new Date(t * 1000).toLocaleTimeString([], { hour12: false });
// Display names only: the keys the server sends (engine states, VRAM parts, request states) stay as they are in the code.
const ENG_ZH = { connecting: "連線中", ready: "就緒", loading: "載入中", stopping: "停止中", stopped: "已停止", restarting: "重新啟動中" };
const ACT_ZH = { start: "啟動", stop: "停止", restart: "重新啟動" };
const REQ_STATE_ZH = { running: "推論中", parked: "暫停", admitted: "待命", waiting: "等待中", restoring: "載回快取" };
const NAME_ZH = { "weights": "權重", "KV cache": "KV 快取", "sequence state": "序列狀態", "activations": "激活值",
  "CUDA context & runtime": "CUDA 環境與執行階段", "other programs & driver": "其他程式與驅動程式", "engine (loading)": "引擎（載入中）",
  "free": "可用", "active sequences": "執行中的序列", "prefix cache only": "僅前綴快取", "parked state": "暫停的狀態",
  "budget left": "預算剩餘", "context (at start)": "啟動時的 CUDA context", "graphs & libraries": "CUDA graph 與函式庫",
  "embedding": "嵌入表", "state cache": "狀態快取", "state checkpoints": "狀態存檔點" };
const zhName = (n) => NAME_ZH[n] || n;
const FINISH_ZH = { stop: "正常結束", length: "達輸出上限", error: "錯誤", cancelled: "已取消", tool_calls: "呼叫工具" };
const KIND_ZH = { submit: "已送出", error: "錯誤", engine: "引擎", http: "HTTP" };
const WAIT_ZH = { kv: "KV 空間", speed: "速度下限" };
function el(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "style") e.style.cssText = v; else if (k === "class") e.className = v; else e.setAttribute(k, v);
  }
  for (const k of kids) if (k != null) e.append(k instanceof Node ? k : document.createTextNode(String(k)));
  return e;
}

// ---------------------------------------------------------------- tooltip
const tip = $("tip");
function showTip(x, y, rows, title) {
  tip.replaceChildren();
  if (title) tip.append(el("div", { class: "muted", style: "margin-bottom:3px" }, title));
  for (const [color, value, label] of rows) {
    const k = el("div", { class: "k" });
    if (color) k.append(el("i", { style: `background:${color}` }));
    k.append(el("b", {}, value), el("span", { class: "muted" }, label));
    tip.append(k);
  }
  tip.style.display = "block";
  const w = tip.offsetWidth, h = tip.offsetHeight;
  tip.style.left = Math.min(window.innerWidth - w - 8, x + 14) + "px";
  tip.style.top = Math.max(8, y - h - 10) + "px";
}
const hideTip = () => { tip.style.display = "none"; };
function hoverable(node, fn) {
  node.addEventListener("pointermove", (e) => { const r = fn(); showTip(e.clientX, e.clientY, r.rows, r.title); });
  node.addEventListener("pointerleave", hideTip);
}

// ---------------------------------------------------------------- time-series charts
const CHARTS = [
  { key: "util", title: "GPU 使用率", unit: "%", color: "--s1", max: () => 100, fmt: (v) => v.toFixed(0) + "%" },
  { key: "power", title: "功耗", unit: "W", color: "--s2", max: (s) => s?.power_limit || 400, fmt: (v) => v.toFixed(0) + " W",
    note: (s) => s?.power_limit ? `上限 ${s.power_limit.toFixed(0)} W` : "" },
  { key: "decode_tps", title: "解碼速度（所有請求）", unit: "tok/s", color: "--s3", fmt: (v) => fmtRate(v) + " tok/s" },
  { key: "prefill_tps", title: "預填速度（所有請求）", unit: "tok/s", color: "--s6", fmt: (v) => fmtRate(v) + " tok/s" },
];
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const SVGNS = "http://www.w3.org/2000/svg";
const sv = (tag, a) => { const e = document.createElementNS(SVGNS, tag); for (const k in a) e.setAttribute(k, a[k]); return e; };

function niceMax(v) {
  if (v <= 0) return 1;
  const p = 10 ** Math.floor(Math.log10(v)), m = v / p;
  return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 2.5 ? 2.5 : m <= 5 ? 5 : 10) * p;
}

function buildCharts() {
  const box = $("charts");
  for (const c of CHARTS) {
    const svg = sv("svg", {});
    const card = el("div", { class: "chart" },
      el("div", { class: "head" }, el("span", { class: "sub" }, c.title), el("span", {}, el("span", { class: "muted", "data-note": "" }), " ", el("span", { class: "cur" }))),
      svg);
    c.node = card; c.svg = svg;
    svg.addEventListener("pointermove", (e) => {
      const r = svg.getBoundingClientRect();
      state.hover = { x: (e.clientX - r.left) / r.width, cx: e.clientX, cy: e.clientY, chart: c };
      drawCharts();
    });
    svg.addEventListener("pointerleave", () => { state.hover = null; hideTip(); drawCharts(); });
    box.append(card);
  }
}

function drawCharts() {
  const now = Date.now() / 1000, t0 = now - state.range;
  const data = state.history.filter((s) => s.t >= t0 - 2);
  const last = state.history[state.history.length - 1];
  let hoverSample = null;
  for (const c of CHARTS) {
    const svg = c.svg, W = svg.clientWidth || 400, H = 150, L = 44, R = 8, T = 8, B = 20;
    svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
    svg.replaceChildren();
    const vals = data.map((s) => s[c.key]).filter((v) => v != null);
    const ymax = c.max ? c.max(last) : niceMax(Math.max(10, ...vals) * 1.1);
    const x = (t) => L + (t - t0) / state.range * (W - L - R);
    const y = (v) => T + (1 - Math.min(v, ymax) / ymax) * (H - T - B);
    for (let i = 0; i <= 4; i++) {
      const v = ymax * i / 4, yy = y(v);
      svg.append(sv("line", { x1: L, x2: W - R, y1: yy, y2: yy, stroke: i === 0 ? css("--axis") : css("--grid"), "stroke-width": 1 }));
      const lab = sv("text", { x: L - 6, y: yy + 4, "text-anchor": "end", "font-size": 11, fill: css("--muted"), class: "num" });
      lab.textContent = c.key === "util" ? v.toFixed(0) : fmtRate(v); svg.append(lab);
    }
    const ticks = state.range <= 60 ? [60, 45, 30, 15, 0] : state.range <= 300 ? [300, 240, 180, 120, 60, 0] : [600, 480, 360, 240, 120, 0];
    for (const s of ticks) {
      const lab = sv("text", { x: x(now - s), y: H - 4, "text-anchor": s === 0 ? "end" : "middle", "font-size": 11, fill: css("--muted") });
      lab.textContent = s === 0 ? "現在" : `-${s >= 60 ? s / 60 + "m" : s + "s"}`; svg.append(lab);
    }
    const pts = data.filter((s) => s[c.key] != null);
    const color = css(c.color);
    if (pts.length > 1) {
      // Gaps (no samples for > 3 sampling periods) break the line.
      let d = "", area = "", seg = [];
      const flush = () => {
        if (seg.length > 1) {
          const p = seg.map((s, i) => `${i ? "L" : "M"}${x(s.t).toFixed(1)},${y(s[c.key]).toFixed(1)}`).join("");
          d += p;
          area += p + `L${x(seg[seg.length - 1].t).toFixed(1)},${y(0)}L${x(seg[0].t).toFixed(1)},${y(0)}Z`;
        }
        seg = [];
      };
      for (let i = 0; i < pts.length; i++) {
        if (i && pts[i].t - pts[i - 1].t > 3 * state.sampleS + 0.5) flush();
        seg.push(pts[i]);
      }
      flush();
      svg.append(sv("path", { d: area, fill: color, "fill-opacity": 0.1, stroke: "none" }));
      svg.append(sv("path", { d, fill: "none", stroke: color, "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round" }));
      const e = pts[pts.length - 1];
      svg.append(sv("circle", { cx: x(e.t), cy: y(e[c.key]), r: 4, fill: color, stroke: css("--surface"), "stroke-width": 2 }));
    }
    if (state.hover && pts.length) {
      const th = t0 + (state.hover.x * W - L) / (W - L - R) * state.range;
      let best = pts[0];
      for (const s of pts) if (Math.abs(s.t - th) < Math.abs(best.t - th)) best = s;
      if (Math.abs(best.t - th) < 5 * state.sampleS) {
        const xx = x(best.t);
        svg.append(sv("line", { x1: xx, x2: xx, y1: T, y2: H - B, stroke: css("--muted"), "stroke-width": 1 }));
        svg.append(sv("circle", { cx: xx, cy: y(best[c.key]), r: 4, fill: color, stroke: css("--surface"), "stroke-width": 2 }));
        if (state.hover.chart === c) hoverSample = best;
      }
    }
    const cur = last && last[c.key] != null && now - last.t < 5 ? c.fmt(last[c.key]) : "–";
    c.node.querySelector(".cur").textContent = cur;
    c.node.querySelector("[data-note]").textContent = c.note ? c.note(last) : "";
  }
  if (hoverSample && state.hover) {
    const s = hoverSample;
    showTip(state.hover.cx, state.hover.cy, [
      [css("--s1"), s.util != null ? s.util + "%" : "–", "GPU 使用率"],
      [css("--s2"), s.power != null ? s.power.toFixed(0) + " W" : "–", "功耗"],
      [css("--s3"), fmtRate(s.decode_tps) + " tok/s", "解碼"],
      [css("--s6"), fmtRate(s.prefill_tps) + " tok/s", "預填"],
      [null, `${s.sm_clock ?? "–"} MHz`, "SM 時脈"],
      [null, `${s.running} 執行中、${s.waiting} 等待中`, ""],
    ], clock(s.t));
  }
}

// ---------------------------------------------------------------- tiles
function tile(label, value, note, meter, meterColor) {
  const t = el("div", { class: "card tile" }, el("div", { class: "label" }, label), el("div", { class: "value" }, value));
  if (meter != null) t.append(el("div", { class: "meter" }, el("div", { style: `width:${Math.max(0, Math.min(100, meter * 100)).toFixed(1)}%;background:${meterColor || "var(--s1)"}` })));
  t.append(el("div", { class: "note" }, note || " "));
  return t;
}
const n0 = (v) => v == null ? "–" : Number(v).toLocaleString();
function drawTiles() {
  const s = state.history[state.history.length - 1] || {}, tk = state.tick, v = tk?.vram, c = tk?.cache, sch = tk?.sched;
  const fresh = s.t && Date.now() / 1000 - s.t < 5;
  const used = s.used, total = s.total || v?.total;
  const app = v ? v.parts.filter((p) => !["free", "other programs & driver"].includes(p.name)).reduce((a, p) => a + p.bytes, 0) : null;
  const hit = c && c.prompt_tokens ? c.cached_tokens / c.prompt_tokens : null;
  const powerFrac = s.power != null && s.power_limit ? s.power / s.power_limit : null;
  const tiles = [
    tile("GPU 使用率", fresh && s.util != null ? s.util + "%" : "–", fresh ? `記憶體忙碌 ${s.mem_util ?? "–"}%` : "沒有 GPU 取樣", fresh ? (s.util || 0) / 100 : null),
    tile("功耗", fresh && s.power != null ? s.power.toFixed(0) + " W" : "–", fresh ? `上限 ${s.power_limit?.toFixed(0) ?? "–"} W · ${s.temp ?? "–"} °C` : "", fresh ? powerFrac : null,
      powerFrac != null && powerFrac > 0.97 ? "var(--serious)" : "var(--s2)"),
    tile("時脈", fresh && s.sm_clock != null ? s.sm_clock + " MHz" : "–", fresh ? `記憶體 ${s.mem_clock ?? "–"} MHz` : ""),
    tile("VRAM 使用量", used != null ? fmtGiB(used) : v ? fmtGiB(v.total - v.parts.find((p) => p.name === "free").bytes) : "–",
      app != null ? `伺服器 ${fmtGiB(app)}` : "", used != null && total ? used / total : null),
    tile("解碼速度", fresh ? fmtRate(s.decode_tps) + " tok/s" : "–", "所有請求"),
    tile("預填速度", fresh ? fmtRate(s.prefill_tps) + " tok/s" : "–", "已計算的輸入 token"),
    tile("請求", sch ? `${sch.running} 執行中` : "–", sch ? `${sch.waiting} 等待中 · 目標 ${sch.target_seqs}${sch.blocked ? " · 受阻：" + (WAIT_ZH[sch.blocked] || sch.blocked) : ""}` : ""),
    tile("前綴快取命中率", fmtPct(hit), c ? `${fmtTok(c.cached_tokens)} / ${fmtTok(c.prompt_tokens)} tok` : "", hit),
  ];
  // Turn 2+: only requests that had something to reuse (cached / reusable); diverged: they left their best earlier sequence
  // before its end (the worker log has the text around that token).
  const px = tk?.prefix;
  if (px) tiles.push(
    tile("第 2 輪起命中率", fmtPct(px.turn2_hit), `${n0(px.turn2_requests)} 個請求 · ${n0(px.diverged)} 個偏離`, px.turn2_hit),
    tile("存檔點槽位", px.slots != null ? `${n0(px.checkpoints)} / ${n0(px.slots)}` : n0(px.checkpoints),
      `逐出次數 ${n0(px.evicted)}` + (px.slots_allocated != null ? ` · 已配置 ${n0(px.slots_allocated)}` : ""),
      px.slots ? (px.checkpoints || 0) / px.slots : null));
  $("tiles").replaceChildren(...tiles);
}

// ---------------------------------------------------------------- VRAM
const VRAM_COLORS = { "weights": "--s1", "KV cache": "--s2", "sequence state": "--s3", "activations": "--s4",
  "CUDA context & runtime": "--s5", "other programs & driver": "--s6", "engine (loading)": "--s1", "free": "--track" };
const KV_COLORS = { "active sequences": "--s2", "prefix cache only": "--s1", "parked state": "--s3", "free": "--track" };
const SEQ6 = ["--s1", "--s2", "--s3", "--s4", "--s5", "--s6", "--track"];
function stackBar(node, legend, parts, total, colorOf, label) {
  node.replaceChildren(); legend.replaceChildren();
  parts.forEach((p, i) => {
    if (p.bytes <= 0) return;
    const color = `var(${colorOf(p, i)})`;
    const d = el("div", { style: `flex:${p.bytes} 1 0;background:${color}` });
    hoverable(d, () => ({ title: label ? `${label}：${zhName(p.name)}` : zhName(p.name), rows: [[css(colorOf(p, i)), fmtMem(p.bytes), `${(p.bytes / total * 100).toFixed(1)}%`],
      ...(p.extra || []).map((e) => [null, e, ""])] }));
    node.append(d);
    legend.append(el("span", {}, el("i", { style: `background:${color}` }), `${zhName(p.name)} `, el("span", { class: "num", style: "color:var(--ink)" }, fmtMem(p.bytes))));
  });
}
function drawVram() {
  const v = state.tick?.vram, eng = state.tick?.engine;
  if (!v || !v.engine) {
    $("vram-sum").textContent = (eng === "stopped" ? "引擎尚未載入。" : "等待引擎。") + (v ? ` 裝置共 ${fmtGiB(v.total)}。` : "");
    if (v) stackBar($("vram-bar"), $("vram-legend"), v.parts, v.total, (p) => VRAM_COLORS[p.name] || "--track");
    else for (const id of ["vram-bar", "vram-legend"]) $(id).replaceChildren();
    for (const id of ["kv-bar", "kv-legend", "w-bar", "w-legend", "vram-table"]) $(id).replaceChildren();
    $("mem-grid").style.display = "none";
    return;
  }
  $("mem-grid").style.display = "";
  const free = v.parts.find((p) => p.name === "free").bytes;
  const app = v.parts.filter((p) => !["free", "other programs & driver"].includes(p.name)).reduce((a, p) => a + p.bytes, 0);
  $("vram-sum").textContent = `裝置共 ${fmtGiB(v.total)} · 本伺服器 ${fmtGiB(app)} · 可用 ${fmtGiB(free)} · 池預算 ${fmtGiB(v.budget)}`;
  stackBar($("vram-bar"), $("vram-legend"), v.parts, v.total, (p) => VRAM_COLORS[p.name] || "--track");
  const kv = v.parts.find((p) => p.name === "KV cache");
  const tokPerByte = v.kv_page_bytes ? v.kv_page_tokens / v.kv_page_bytes : 0;
  const kvParts = kv.parts.map((p) => ({ ...p, extra: [`${fmtTok(p.bytes * tokPerByte)} token`] }));
  stackBar($("kv-bar"), $("kv-legend"), kvParts, kv.bytes, (p) => KV_COLORS[p.name] || "--track", "KV");
  $("kv-sum").textContent = `${fmtGiB(kv.bytes)} · ${fmtTok(kv.bytes * tokPerByte)} token · 狀態存檔點 ${v.checkpoints} / ${v.slots}`;
  const w = v.parts.find((p) => p.name === "weights");
  stackBar($("w-bar"), $("w-legend"), w.parts, w.bytes, (p, i) => SEQ6[Math.min(i, 6)], "權重");
  $("w-sum").textContent = fmtGiB(w.bytes);
  const tb = $("vram-table"); tb.replaceChildren();
  tb.append(el("tr", {}, el("th", {}, "區域"), el("th", { class: "r" }, "大小"), el("th", { class: "r" }, "占比")));
  for (const p of v.parts) {
    tb.append(el("tr", {}, el("td", {}, el("span", { class: "lvl" }, el("i", { class: "dot", style: `background:var(${VRAM_COLORS[p.name]});border-radius:2px` }), zhName(p.name))),
      el("td", { class: "r" }, fmtMem(p.bytes)), el("td", { class: "r" }, (p.bytes / v.total * 100).toFixed(1) + "%")));
    if (["sequence state", "activations", "CUDA context & runtime"].includes(p.name))
      for (const q of p.parts.slice(0, 4)) if (q.bytes >= 16 * MiB)
        tb.append(el("tr", {}, el("td", { class: "muted", style: "padding-left:26px" }, zhName(q.name)), el("td", { class: "r muted" }, fmtMem(q.bytes)), el("td", {})));
  }
  for (const h of v.host) if (h.bytes > 0 || h.planned)
    tb.append(el("tr", {}, el("td", { class: "muted" }, `固定主機記憶體：${zhName(h.name)}` + (h.planned ? `（依需求配置，共 ${fmtMem(h.planned)}）` : "")),
      el("td", { class: "r muted" }, fmtMem(h.bytes)), el("td", { class: "r muted" }, "RAM")));
}

// ---------------------------------------------------------------- sessions
// "restoring" (SPILL_ASYNC_PROMOTE): a waiting request whose cached prefix is being loaded from RAM / SSD in the background.
const STATE_COLOR = { running: "--good", parked: "--s1", admitted: "--muted", waiting: "--warning", restoring: "--s6" };
const isQueued = (s) => s.state === "waiting" || s.state === "restoring";  // not in the engine yet: nothing prefilled
function ctxBar(s) {
  const prompt = s.prompt, cached = Math.min(s.cached, prompt), fed = Math.max(s.fed, isQueued(s) ? 0 : cached);
  const parts = [
    ["快取" + (isQueued(s) ? "（預期）" : ""), cached, "--s1"],
    ["已預填", Math.max(0, fed - cached), "--s3"],
    ["待計算的輸入", Math.max(0, prompt - Math.max(fed, cached)), "--pending"],
    ["已生成", s.out, "--s2"],
  ];
  const total = prompt + s.out || 1;
  const wrap = el("div", { class: "ctx" }), bar = el("div", { class: "stack thin" });
  for (const [name, n, color] of parts) {
    if (n <= 0) continue;
    const d = el("div", { style: `flex:${n} 1 0;background:var(${color})` });

  let [name, sub] = o.names?.[v] || (o.key === "weights" && /^[^/]+\/[^/@]+(@.+)?$/.test(v) ? repoName(v) : [fmtVal(o.key, v)]);
  if (o.key === "vram_reserve_gib" && v == null && p?.budget) sub = fmtGiB(p.budget);
  const unavailable = o.key === "weights" && L.weights[v];
  const b = el("button", { class: "opt", "aria-pressed": String(L.form[o.key] === v), type: "button" },
    el("b", {}, name), sub ? el("span", { class: "muted", style: "font-size:11px" }, " " + sub) : null,
    el("span", { class: "n" + (p?.error || unavailable ? " bad" : "") },
      unavailable ? (unavailable.includes("tokenizer") ? "其他 tokenizer" : "尚未下載") : planNote(p)));
  if (L.running && L.running[o.key] === v) b.append(el("i", { class: "run", title: "執行中的引擎" }));
  if (unavailable) { b.disabled = true; b.title = L.weights[v]; }
  else if (p?.error) b.title = p.error;
  else if (p) b.title = `每個請求的上下文 ${p.max_tokens.toLocaleString()} token\nKV 池 ${p.kv_tokens.toLocaleString()} token（所有請求共用）\n裝置池 ${fmtGiB(p.device)}，預算 ${fmtGiB(p.budget)}`;
  b.addEventListener("click", () => setForm(o.key, v));
  return b;
}
// The plan failed because the engine is not running and other programs hold the VRAM (no setting would fit now).
const vramTaken = () => L.plan?.device?.source === "nvml" && /not enough VRAM/.test(L.plan.plan?.error || "");
setInterval(() => { if (!$("launch").hidden && vramTaken()) replan(); }, 5000);
// The time without a request before an unload: not a start setting, it changes without touching the engine.
async function setIdle(seconds) {
  try {
    const r = await fetch("/admin/engine/idle", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ idle_unload_s: seconds }) });
    const d = await r.json();
    if (!r.ok) alert(`閒置卸載設定失敗：${d.error?.message || r.status}`);
  } catch (e) { alert(`閒置卸載設定失敗：${e}`); }
  await loadLaunch(false);
}
function idleRow() {
  const row = el("div", { class: "choices" }), values = [0, 300, 1800, 3600];
  for (const v of values) {
    const b = el("button", { class: "opt", "aria-pressed": String(L.idle === v), type: "button", title: "只保留到伺服器重新啟動為止" },
      el("b", {}, v ? fmtDur(v) : "關閉"));
    b.addEventListener("click", () => setIdle(v));
    row.append(b);
  }
  const inp = el("input", { type: "number", min: "0", step: "1", placeholder: "分鐘", "aria-label": "沒有請求多少分鐘後卸載" });
  if (L.idle != null && !values.includes(L.idle)) inp.value = L.idle / 60;
  inp.addEventListener("change", () => { const v = parseFloat(inp.value); if (isFinite(v) && v >= 0) setIdle(v * 60); });
  row.append(el("label", { class: "opt", style: "cursor:default" }, el("b", {}, "自訂 "), inp, el("span", { class: "n" }, "分鐘")));
  return row;
}
function drawLaunch() {
  const box = $("opts"), sum = $("plan-sum");
  if (!L.form) { box.replaceChildren(el("div", { class: "empty" }, L.err || "正在載入設定…")); sum.replaceChildren(); return; }
  const variants = L.plan?.variants || {};
  box.replaceChildren();
  for (const o of OPTS) {
    const row = el("div", { class: "choices" });
    const vs = (variants[o.key] || []).slice();
    if (!vs.some((x) => x.value === L.form[o.key])) vs.push({ value: L.form[o.key], plan: L.plan?.plan });
    if (o.key === "weights") for (const w of Object.keys(L.weights)) if (!vs.some((x) => x.value === w)) vs.push({ value: w, plan: null });
    for (const { value, plan } of vs) row.append(optButton(o, value, plan));
    if (o.custom) {
      const inp = el("input", { type: "number", min: "0", step: "0.25", placeholder: "GiB", "aria-label": "VRAM 預留量（GiB）" });
      if (L.form.vram_reserve_gib != null) inp.value = L.form.vram_reserve_gib;
      inp.addEventListener("change", () => { const v = parseFloat(inp.value); setForm("vram_reserve_gib", isFinite(v) && v >= 0 ? v : null); });
      row.append(el("label", { class: "opt", style: "cursor:default" }, el("b", {}, "自訂 "), inp, el("span", { class: "n" }, "GiB")));
    }
    box.append(el("div", { class: "k" }, o.label, o.note ? el("small", {}, o.note) : null), row);
  }
  box.append(el("div", { class: "k" }, "閒置時卸載", el("small", {}, "立即生效")), idleRow());
  if (MEDIA_OPTS.some((o) => L.form[o.key] !== undefined)) {
    box.append(el("div", { class: "k", style: "grid-column:1/-1;margin-top:10px" }, "影片與圖片",
      el("small", {}, "圖片與影片最多可佔用的 token 數（見 docs/configuration.md「Long videos」）。留空為預設值。重新啟動引擎後生效。")));
    for (const o of MEDIA_OPTS) {
      const row = mediaRow(o);
      if (row) box.append(el("div", { class: "k" }, o.label, el("small", {}, o.note)), row);
    }
    if (L.form.vision === "off") box.append(el("div", { class: "muted", style: "grid-column:1/-1" }, "視覺編碼器已關閉：圖片與影片會被拒絕，這些設定不會使用。"));
  }
  if (TIER_OPTS.some((o) => L.form[o.key] !== undefined)) {
    box.append(el("div", { class: "k", style: "grid-column:1/-1;margin-top:10px" }, "分層快取",
      el("small", {}, "KV 池擠出的存檔點先放進 RAM，再放進 SSD。重新啟動引擎後生效。")));
    const ram = snapHost()?.ram_total_bytes, want = L.form.spill_ram_gib || 0;
    for (const o of TIER_OPTS) {
      const row = tierRow(o);
      if (!row) continue;
      box.append(el("div", { class: "k" }, o.label, el("small", {}, o.note)), row);
    }
    if (ram && want * (1 << 30) > ram) box.append(el("div", { class: "bad", style: "grid-column:1/-1" }, `RAM 層 ${want} GiB 超過這台機器的 RAM（${fmtGiB(ram)}）：會使用交換空間，或是失敗。`));
    if (L.form.spill_ram_gib === 0) box.append(el("div", { class: "muted", style: "grid-column:1/-1" }, "RAM 層為 0：分層快取已關閉，其他分層設定不會使用。"));
  }
  // The plan of the settings as chosen.
  const p = L.plan?.plan, dev = L.plan?.device;
  sum.replaceChildren();
  if (L.err) sum.append(el("div", { class: "bad" }, L.err));
  else if (!p) sum.append(el("div", { class: "muted" }, "規劃中…"));
  else if (vramTaken()) sum.append(el("div", { class: "bad" }, `目前 ${fmtGiB(dev.total)} 的 VRAM 只剩 ${fmtGiB(dev.free)} 可用：其他程式正在使用。` +
    "各選項依目前的可用量規劃，釋放後會更新；仍可儲存設定供下次載入。"));
  else if (p.error) sum.append(el("div", { class: "bad" }, `這些設定放不下：${p.error}`));
  else {
    sum.append(el("div", { class: "big" }, "每個請求的上下文 ", el("b", {}, p.max_tokens.toLocaleString()), " token",
      p.max_tokens < L.form.max_tokens ? el("span", { class: "muted" }, `（已從 ${L.form.max_tokens.toLocaleString()} 降到預算容許的值）`) : null,
      " · KV 池 ", el("b", {}, p.kv_tokens.toLocaleString()), ` token，最多由 ${L.form.max_seqs} 個請求共用`));
    const pools = [["weights", p.pools.weights, "--s1"], ["KV cache", p.pools.kv, "--s2"], ["sequence state", p.pools.state, "--s3"],
      ["activations", p.pools.activations, "--s4"], ["budget left", Math.max(0, p.budget - p.device), "--track"]];
    const bar = el("div", { class: "stack thin" }), leg = el("div", { class: "legend", style: "margin-top:4px" });
    stackBar(bar, leg, pools.map(([name, bytes, c]) => ({ name, bytes, c })), p.budget, (q) => q.c, "規劃");
    sum.append(bar, leg);
    sum.append(el("div", { class: "muted" }, `裝置池 ${fmtGiB(p.device)}，預算 ${fmtGiB(p.budget)}` +
      "（預算 = 可用 VRAM 減去留給其他程式的預留量" + (L.form.vram_reserve_gib == null ? "，預設 1.0 GiB）" : "）") +
      ` · 固定主機記憶體 ${fmtGiB(p.host)} · 可用裝置記憶體 ${fmtGiB(dev.free)} ` +
      (dev.source === "engine" ? "（執行中引擎配置各個池之前的值）" : "（目前值，扣除引擎的 CUDA context：估計值）")));
  }
  const changes = launchChanges();
  if (changes.length) sum.append(el("div", {}, el("span", { class: "muted" }, L.running ? "與執行中引擎的差異：" : "與已儲存設定的差異："), changes.join(" · ")));
  const keep = Object.entries(L.keep || {});
  if (keep.length) sum.append(el("div", {}, el("div", { class: "muted" }, "這裡的變更只保留到伺服器重新啟動為止。要永久保留，請設定這些變數（Docker 用 .env，Windows 程式包用 settings.ini）："),
    el("div", { style: "font-family:monospace;white-space:pre-wrap;user-select:all" }, keep.map(([k, v]) => `${k}=${v}`).join("\n"))));
  drawGo();
}
function drawGo() {
  drawHeader();
  const p = L.plan?.plan, eng = state.tick?.engine || L.eng, changes = launchChanges(), running = !!eng && eng !== "stopped";
  const go = $("l-go");
  go.textContent = running ? (changes.length ? "以這些設定重新啟動" : "重新啟動") : "以這些設定啟動";
  go.disabled = state.busy || !p || !!p.error || !p.fits || ["stopping", "loading"].includes(eng);
  go.onclick = () => engineAction(running ? "restart" : "start");
  const save = $("l-save");
  save.hidden = running;
  save.disabled = state.busy || !changes.length;
}
$("l-save").addEventListener("click", async () => {
  state.busy = true; drawGo();
  try {
    const r = await fetch("/admin/engine", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ action: "save", settings: L.form }) });
    if (!r.ok) alert(`儲存失敗：${(await r.json()).error?.message || r.status}`);
  } catch (e) { alert(`儲存失敗：${e}`); }
  state.busy = false;
  await loadLaunch(false);
});
$("l-reset").addEventListener("click", () => { L.form = { ...(L.running || L.saved) }; replan(); });
function showLaunch(open) {
  $("launch").hidden = !open;
  $("cfg").setAttribute("aria-expanded", String(open));
  try { localStorage.setItem("q27-launch-open", open ? "1" : ""); } catch (e) { /* (no storage) */ }
  drawHeader();
}
$("cfg").addEventListener("click", () => showLaunch($("launch").hidden));
$("l-close").addEventListener("click", () => showLaunch(false));
document.querySelectorAll("#range button").forEach((b) => b.addEventListener("click", () => {
  document.querySelectorAll("#range button").forEach((o) => o.setAttribute("aria-pressed", String(o === b)));
  state.range = +b.dataset.s; drawCharts();
}));
window.addEventListener("resize", drawCharts);
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", drawAll);

function addSample(s) {
  if (!s) return;
  const h = state.history;
  if (!h.length || s.t > h[h.length - 1].t) h.push(s);
  while (h.length && h[0].t < Date.now() / 1000 - 660) h.shift();
}
function connect() {
  const es = new EventSource("/ui/stream");
  es.addEventListener("init", (ev) => {
    const d = JSON.parse(ev.data);
    state.info = d.info; state.init = d; state.sampleS = d.sample_s || 1; state.history = d.history; state.log = d.log; state.tick = d.tick;
    $("conn").textContent = "即時";
    drawAll(); drawLog();
  });
  es.addEventListener("tick", (ev) => {
    const d = JSON.parse(ev.data);
    state.tick = d; addSample(d.sample);
    if (L.eng !== null && d.engine !== L.eng && ["ready", "stopped"].includes(d.engine)) { L.eng = d.engine; loadLaunch(false); }
    if (d.engine === "ready" && !state.info.max_tokens) { es.close(); connect(); return; }
    drawAll();
  });
  es.addEventListener("log", (ev) => {
    state.log.push(...JSON.parse(ev.data));
    if (state.log.length > 500) state.log.splice(0, state.log.length - 500);
    drawLog();
  });
  es.onerror = () => { $("conn").textContent = "已中斷，重新連線中"; };
}
buildCharts();
loadLaunch(true);
loadUiState();
setInterval(loadUiState, 10000);
try { if (localStorage.getItem("q27-launch-open")) showLaunch(true); } catch (e) { /* (no storage) */ }
connect();
</script>
