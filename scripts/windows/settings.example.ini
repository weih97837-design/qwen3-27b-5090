; Settings of the Windows package. Copy this file to settings.ini, next to qwen3-27b-tray.exe and start.cmd, and remove
; the ";" of what you change. They apply when the server starts. An update does not touch settings.ini.
; All the variables of docs/configuration.md work here. settings.ini comes before the environment.
; Settings in the tray app's menu edits this file too, keeping these comments.

[env]
; The Hugging Face cache with the weights (23 GB). Relative to this folder; another path keeps them out of it, e.g. to
; share an existing cache (%USERPROFILE%\.cache\huggingface), written in full.
;HF_HOME=huggingface

; The address of the API and the web UI (0.0.0.0: the network, which Windows Firewall asks about; anyone there can then
; change the engine's settings, as /admin has no authentication).
;HOST=127.0.0.1
;PORT=46320

; The tray app: seconds without a request before the engine frees its VRAM (0: never), and 1 to load it at the start
; instead of at the first request. start.cmd: never, and it loads at the start.
;ENGINE_IDLE_UNLOAD_S=1800
;ENGINE_AUTOSTART=0

; Long videos: tokens and frames a video may take at most. This fork's defaults are 131072 and 2048 (the checkpoint's own
; are 12288 and 768; short videos, up to about 2.8 minutes at 2 frames per second, are the same with either; see "Long
; videos" in docs/configuration.md). IMAGE_TOKENS follows VIDEO_MAX_TOKENS unless it is set: 10 KiB of pinned host
; memory per token (1.25 GiB at 131072), and 6 KiB while a video is encoded. With 32 GiB of RAM or less take less, e.g.
; 32768. The tray's Settings window and the stats page have all three; empty is the default.
;VIDEO_MAX_TOKENS=131072
;VIDEO_MAX_FRAMES=2048
;IMAGE_TOKENS=131072

; Tiered KV cache (docs/tiered-cache.md). RAM tier: SPILL_RAM_GIB (default 64; 0: no tiered cache). The SSD tier is OFF by
; default: SPILL_SSD_GIB=0 (also when you write 0 here) means nothing is written to, read from or deleted in SPILL_DIR, and a
; checkpoint pushed out of a full RAM tier is dropped. Cost: after an engine restart the RAM and VRAM cache is cold. To turn the
; SSD tier on, set a cap in GiB (e.g. 100); a value you set here always wins over the default, so an existing SPILL_SSD_GIB=200
; keeps the tier. SPILL_DIR is where its files go (default: the kvcache folder in %LOCALAPPDATA%\qwen3-27b-5090; write a full path, %VARIABLES% are not expanded here). SPILL_SSD_MIN_TOKENS,
; SPILL_SSD_MIN_FREE_GIB, SPILL_SSD_WARM_ONLY, SPILL_PROBATION_GIB, SPILL_TTL_DAYS and SPILL_FLUSH_ON_STOP_S only matter with it on.
;SPILL_RAM_GIB=64
;SPILL_SSD_GIB=100
;SPILL_DIR=D:\kvcache
; When a tier is full the victim is chosen over the whole tier (superseded, never-reused, oldest). 1: the agent using the most
; of the tier is the first victim (measured RAM reuse about 6% instead of about 30%). Default 0.
;SPILL_FAIR_AGENTS=0
